name: poorvabhas

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-poorvabhas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-poorvabhas_dev}
      POSTGRES_DB: ${POSTGRES_DB:-poorvabhas}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-poorvabhas} -d ${POSTGRES_DB:-poorvabhas}"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-poorvabhas}:${POSTGRES_PASSWORD:-poorvabhas_dev}@postgres:5432/${POSTGRES_DB:-poorvabhas}
      SECRET_KEY: ${SECRET_KEY:-compose-demo-secret-change-me-before-any-real-use-0123456789}
      AUTO_SEED: ${AUTO_SEED:-true}
      ENVIRONMENT: ${ENVIRONMENT:-demo}
      DEMO_MODE: ${DEMO_MODE:-true}
      MODEL_PATH: /app/models_store
      VECTOR_BACKEND: pgvector
      CORS_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - models:/app/models_store
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        API_URL: http://backend:8000
    environment:
      API_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
  models:
